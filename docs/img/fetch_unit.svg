<rect width="1180" height="520" rx="14" fill="#ffffff"/>
<text x="30" y="40" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#0f172a">fetch_unit — decoupled instruction fetch</text>
<text x="30" y="62" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#475569">Requests run ahead of decode; responses are paired with the oldest in-flight PC and parked until decode takes them.</text>
