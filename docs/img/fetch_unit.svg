<rect x="40" y="214" width="200" height="100" rx="8" fill="#fee2e2" fill-opacity="1" stroke="#dc2626" stroke-width="1.6"/>
<text x="140.0" y="234" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a">issue logic</text>
